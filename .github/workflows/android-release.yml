name: Android release

# Builds an installable APK on GitHub's runners.
#
# - Publish a release: run it from the Actions tab ("Run workflow") with a
#   version such as 1.0.0. It builds the APK, creates the v1.0.0 tag on the
#   commit it built and publishes a GitHub Release with the APK attached.
#   Pushing a tag like v1.0.0 does the same.
# - Test build: run it by hand with the version left empty. The APK is kept as
#   a workflow artifact for 14 days and nothing is published.
#
# Signing: if the repository has the ANDROID_KEYSTORE_* secrets (see the
# README), the APK is signed with that key. Without them it is signed with the
# shared React Native debug key, which installs fine but is not private, and
# the release notes say so.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version, like 1.0.0. Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            RELEASE_TAG="v${INPUT_VERSION#v}"
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            VERSION="${RELEASE_TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.0.0, not '$VERSION'."
              exit 1
            fi
            # Stop before a long build if this version is already out.
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $RELEASE_TAG already exists. Use a new version number."
              exit 1
            fi
          else
            VERSION="$(node -p "require('./app.json').expo.version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          # Every build gets a higher versionCode, so a newer APK installs over an older one.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.version = process.argv[1];
            c.expo.android.versionCode = Number(process.argv[2]);
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
          " "$VERSION" "$GITHUB_RUN_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # 64-bit ARM covers practically every Android phone sold since 2017 and
      # keeps the download small (the speech engine adds about 10 MB per ABI).
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Sign
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK_IN=android/app/build/outputs/apk/release/app-release.apk
          APK_OUT="freq-${{ steps.version.outputs.version }}-arm64.apk"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$APK_OUT" "$APK_IN"
            rm -f "$RUNNER_TEMP/release.jks"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            cp "$APK_IN" "$APK_OUT"
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with the shared debug key."
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_OUT" | head -3
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          ls -la "$APK_OUT"

      - name: Keep the APK (test builds)
        if: steps.version.outputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: ${{ steps.sign.outputs.apk }}
          retention-days: 14

      - name: Publish the release
        if: steps.version.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING: ${{ steps.sign.outputs.signing }}
          APK: ${{ steps.sign.outputs.apk }}
          TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          {
            echo "Install on Android: download **$APK** below on your phone and open it. Android asks once to allow installs from your browser or file manager."
            echo
            echo "Needs Android 8 or later on a 64-bit phone. Background listening and on-device subtitles are included."
            if [[ "$SIGNING" == "debug" ]]; then
              echo
              echo "> This build is signed with the shared React Native debug key. It installs and updates normally, but the key is public, so only install builds from this page."
            fi
          } > notes.md
          # Creates the tag on the commit that was built, if it does not exist yet.
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Freq $TAG" --notes-file notes.md
