plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.freqplayback'
version = '1.0.0'

android {
  namespace "expo.modules.freqplayback"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // On-device speech recognition for subtitles (Kaldi, Apache 2.0). The
  // model is not bundled; the app downloads it the first time subtitles are
  // turned on.
  implementation 'com.alphacephei:vosk-android:0.3.75@aar'
  implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
